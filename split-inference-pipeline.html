{ ...((s.ssh.conn || {})[id] || {}), ...patch } } } })); }\n  sshServerPatch(patch) { this.setState(s => ({ ssh: { ...s.ssh, server: { ...s.ssh.server, ...patch } } })); }\n  sshServerTest() {\n    const sv = this.state.ssh.server;\n    this.sshServerPatch({ status: 'connecting' });\n    this.sshLog([{ text: '⇄ testing broker ' + sv.user + '@' + sv.ip + ':' + sv.port + ' …', color: '#22D3EE' }]);\n    setTimeout(() => { this.sshServerPatch({ status: 'on' }); this.sshLog([{ text: '✓ broker reachable · RabbitMQ 3.13 · control API up', color: '#4ade80' }]); }, 700);\n  }\n  sshExpand(id) { this.setState(s => ({ ssh: { ...s.ssh, editing: s.ssh.editing === id ? null : id } })); }\n  sshPatch(patch) { this.setState(s => ({ ssh: { ...s.ssh, ...patch } })); }\n  sshToggle(id) { this.setState(s => { const sel = s.ssh.selected.includes(id) ? s.ssh.selected.filter(x => x !== id) : [...s.ssh.selected, id]; return { ssh: { ...s.ssh, selected: sel } }; }); }\n  sshSelectAll() { const all = this.flatDevices().map(d => d.id); this.setState(s => ({ ssh: { ...s.ssh, selected: s.ssh.selected.length === all.length ? [] : all } })); }\n  sshSetStatus(ids, val) { this.setState(s => { const st = { ...s.ssh.status }; ids.forEach(id => st[id] = val); return { ssh: { ...s.ssh, status: st } }; }); }\n  sshConnectAll(on) {\n    const devs = this.flatDevices();\n    if (!on) { this.sshSetStatus(devs.map(d => d.id), 'off'); this.sshLog([{ text: '⇄ all sessions closed', color: '#94A3B8' }]); return; }\n    this.sshSetStatus(devs.map(d => d.id), 'connecting');\n    this.sshLog([{ text: '⇄ opening SSH sessions…', color: '#22D3EE' }]);\n    setTimeout(() => { this.sshSetStatus(devs.map(d => d.id), 'on'); this.sshLog(devs.map(d => ({ text: '✓ ' + d.host + ' connected', color: '#4ade80' }))); }, 700);\n  }\n  sshLog(lines) { this.setState(s => ({ ssh: { ...s.ssh, out: [...s.ssh.out, ...lines].slice(-300) } })); }\n  sampleOutput(cmd, d) {\n    const c = cmd.trim();\n    if (/nvidia-smi/.test(c)) retur e: g.name, color: this.kindColor(g.kind),\n        devices: g.devices.map(d => { const on = sshS.selected.includes(d.id); const editing = sshS.editing === d.id; return {\n          id: d.id, name: d.name, host: d.host, cluster: d.cluster,\n          ip: d.ip, port: d.port, user: d.user, password: d.password, editing,\n          onToggle: () => this.sshToggle(d.id),\n          onExpand: (e) => { e.stopPropagation(); this.sshExpand(d.id); },\n          onIp: (e) => this.sshConnPatch(d.id, { ip: e.target.value }),\n          onPort: (e) => this.sshConnPatch(d.id, { port: Math.max(1, Math.round(parseFloat(e.target.value) || 22)) }),\n          onUser: (e) => this.sshConnPatch(d.id, { user: e.target.value }),\n          onPassword: (e) => this.sshConnPatch(d.id, { password: e.target.value }),\n          check: on ? '✓' : '', checkColor: on ? 'var(--edge)' : 'var(--border)', checkBg: on ? 'var(--edge)' : 'transparent',\n          dot: dotColor(d.id), statusLabel: statusLabel(d.id),\n          wrapStyle: { borderRadius: '9px', border: '1px solid ' + (editing ? 'var(--edge)' : 'transparent'), background: editing ? 'var(--bg)' : 'transparent' },\n          rowStyle: { display: 'flex', alignItems: 'center', gap: '9px', padding: '7px 8px', borderRadius: '9px', cursor: 'pointer',\n            border: '1px solid ' + (on && !editing ? 'var(--edge)' : editing ? 'transparent' : 'var(--border)'), background: on && !editing ? 'var(--bg)' : 'transparent' } }; }) }; }),\n    };\n\n    // stages\n    R.kinds = ['Edge', 'Fog', 'Cloud', 'Custom'];\n    R.addStageDisabled = stages.length >= 6;\n    R.addStageStyle = { background: stages.length >= 6 ? 'var(--surface)' : 'var(--edge)', color: stages.length >= 6 ? 'var(--muted)' : '#fff', border: 'none', borderRadius: '9px', padding: '9px 15px', fontSize: '13px', fontWeight: 700, cursor: stages.length >= 6 ? 'not-allowed' : 'pointer' };\n    R.onAddStage = () => this.addStage();\n    R.stages = stages.map(s => ({\n      id: s.id, name: s.name, kind: s.kind, color: this.kindColor(s.kind), glyph: this.kindGlyph(s.kind), isEdge: s.kind === 'Edge', notEdge: s.kind !== 'Edge',\n      onName: (e) => this.updateStage(s.id, { name: e.target.value }),\n      onKind: (e) => this.updateStage(s.id, { kind: e.target.value }),\n      onRemove: () => this.removeStage(s.id),\n      onAddDevice: () => this.addDevice(s.id),\n      devices: s.devices.map(d => ({\n        id: d.id, name: d.name, gflops: d.gflops, bw: d.bw, lat: d.lat, cluster: d.cluster, color: this.kindColor(s.kind),\n        onName: (e) => this.updateDevice(s.id, d.id, { name: e.target.value }),\n        onGflops: (e) => this.updateDevice(s.id, d.id, { gflops: this.num(e) }),\n        onBw: (e) => this.updateDevice(s.id, d.id, { bw: this.num(e) }),\n        onLat: (e) => this.updateDevice(s.id, d.id, { lat: this.num(e) }),\n        onCluster: (e) => this.updateDevice(s.id, d.id, { cluster: Math.max(1, Math.round(this.num(e))) }),\n        onView: () => this.openDetail(d.id),\n        onRemove: () => this.removeDevice(s.id, d.id),\n      })),\n    }));\n\n    // clusters + metrics (live)\n    const clusters = this.buildClusters();\n    const metrics = clusters.map(cl => this.simCluster(cl));\n    let agg = 0; metrics.forEach(m => { if (m) agg += m.fps; });\n    R.aggFps = this.f1(agg);\n    R.maxMb = this.maxMb();\n\n    R.clusters = clusters.map((cl, i) => {\n      const m = metrics[i];\n      const border = ['var(--edge)', 'var(--cloud)', 'var(--server)', 'var(--data)', 'var(--broker)', 'var(--alert)'][(cl.id - 1) % 6];\n      const base = {\n        id: cl.id, queue: cl.queue, border,\n        modelName: cl.cfg.modelName, batchSize: cl.cfg.batchSize, numBit: cl.cfg.numBit,\n        onModel: (e) => this.setClusterCfg(cl.id, { modelName: e.target.value }),\n        onBatch: (e) => this.setClusterCfg(cl.id, { batchSize: Math.max(1, Math.round(this.num(e))) }),\n        onNumBit: (e) => this.setClusterCfg(cl.id, { numBit: Math.round(this.num(e)) }),\n        onSplit: (e) => this.setClusterCfg(cl.id, { splitOverride: Math.round(this.num(e)) }),\n      };\n      if (!m) return { ...base, active: false, inactive: true, inactiveReason: 'Idle — assign at least one edge and one cloud device to cluster ' + cl.id + '.', cut: 5, cutMax: 11, edgeNames: '—', cloudNames: '—', fps: '—', e2eMs: '—', msgStr: '—', msgColor: 'var(--muted)', guardHit: false };\n      return { ...base, active: true, inactive: false,\n        edgeNames: cl.edges.map(d => d.name).join(', ') || '—',\n        cloudNames: cl.clouds.map(d => d.name).join(', ') || '—',\n        cut: m.cut, cutMax: m.layerCount - 1,\n        fps: this.f1(m.fps), e2eMs: this.f0(m.e2e), msgStr: this.fmtMsg(m.msg),\n        msgColor: m.msg > this.maxMb() ? 'var(--alert)' : 'var(--data)', guardHit: m.guardHit };\n    });\n\n    // pipeline: edge-side stages | single broker band | cloud-side stages\n    const expanded = st.expanded;\n    const clustersFor = (stg) => {\n      if (!cfg.clustering) return [1];\n      const K = Math.max(1, cfg.numClusters);\n      const set = {}; stg.devices.forEach(d => { set[Math.min(K, Math.max(1, Math.round(d.cluster || 1)))] = 1; });\n      return Object.keys(set).map(Number);\n    };\n    const mkStage = (s, side) => ({ isStage: true, isQueue: false, id: s.id, name: s.name, kind: s.kind, side,\n      clustersStr: clustersFor(s).join(','), color: this.kindColor(s.kind), glyph: this.kindGlyph(s.kind), isEdge: s.kind === 'Edge', notEdge: s.kind !== 'Edge',\n      deviceCount: s.devices.length, expanded: !!expanded[s.id], toggleIcon: expanded[s.id] ? '▾' : '▸',\n      onToggle: () => this.setState(x => ({ expanded: { ...x.expanded, [s.id]: !x.expanded[s.id] } })),\n      onAddDevice: () => this.addDevice(s.id),\n      devices: s.devices.map(d => ({ name: d.name, cluster: d.cluster, effCluster: cfg.clustering ? Math.min(Math.max(1, cfg.numClusters), Math.max(1, Math.round(d.cluster || 1))) : 1 })) });\n    const edgeStages = stages.filter(s => s.kind !== 'Cloud');\n    const cloudStages = stages.filter(s => s.kind === 'Cloud');\n    const pQueues = clusters.map((cl, ci) => {\n      const m = metrics[ci];\n      const depth = m ? Math.min(8, Math.round(m.transferMs / Math.max(1, m.cloudMs) * 5) + 2) : 0;\n      const border = m && (m.transferMs / m.bottleneck) > 0.8 ? 'var(--alert)' : 'var(--broker)';\n      const slots = []; for (let k = 0; k < 8; k++) slots.push({ fill: k < depth ? 'var(--broker)' : 'var(--border)' });\n      return { name: cl.queue, slots, border, cluster: cl.id, rate: m ? this.f1(m.fps) + ' fps' : 'idle' };\n    });\n    const nodes = [];\n    edgeStages.forEach(s => nodes.push(mkStage(s, 'edge')));\n    nodes.push({ isStage: false, isQueue: true, queues: pQueues });\n    cloudStages.forEach(s => nodes.push(mkStage(s, 'cloud')));\n    R.pipelineNodes = nodes;\n    if (st.active === 'pipeline') this.scheduleWires();\n    R.queueDeps = clusters.map((cl, ci) => ({ name: cl.queue, border: ['var(--edge)', 'var(--cloud)', 'var(--server)', 'var(--data)', 'var(--broker)', 'var(--alert)'][(cl.id - 1) % 6],\n      edges: cl.edges.map(d => d.name), clouds: cl.clouds.map(d => d.name) }));\n\n    // config controls\n    R.onToggleClustering = () => this.setCfg({ clustering: !cfg.clustering });\n    R.clusteringTrack = this.toggleStyle(cfg.clustering, 'var(--server)');\n    R.clusteringKnob = this.knobStyle(cfg.clustering);\n    R.clusteringOpacity = cfg.clustering ? 1 : 0.4;\n    R.onNumClusters = (e) => this.setCfg({ numClusters: Math.round(this.num(e)) });\n    R.balanceModes = [\n      { key: 'power', title: 'Power-proportional', desc: 'Cut so each side gets FLOPs ∝ its compute power.' },\n      { key: 'latency', title: 'Latency-minimizing', desc: 'Sweep cuts, pick the lowest end-to-end (compute + transfer).' },\n    ].map(b => ({ ...b, onPick: () => this.setCfg({ autoBalance: b.key }), style: {\n      display: 'flex', flexDirection: 'column', gap: '2px', padding: '10px 12px', borderRadius: '10px', cursor: 'pointer',\n      border: '1px solid ' + (cfg.autoBalance === b.key ? 'var(--server)' : 'var(--border)'),\n      background: cfg.autoBalance === b.key ? 'var(--bg)' : 'transparent',\n      boxShadow: cfg.autoBalance === b.key ? 'inset 3px 0 0 var(--server)' : 'none' } }));\n    const gm = this.getModel(cfg.modelName);\n    R.modelLayerCount = gm.layers.length;\n    R.modelTotalFlops = this.f1(gm.layers.reduce((a, l) => a + l.flops, 0));\n    R.uploadStatus = st.uploadedModel ? st.uploadedModel.label : 'Columns: name, flops, bytes (feature-map size per cut).';\n    R.onUploadModel = (e) => this.onUploadModel(e);\n    R.onToggleManual = () => this.setCfg({ manualEnabled: !cfg.manualEnabled });\n    R.manualTrack = this.toggleStyle(cfg.manualEnabled, 'var(--edge)');\n    R.manualKnob = this.knobStyle(cfg.manualEnabled);\n    R.manualOpacity = cfg.manualEnabled ? 1 : 0.4;\n    R.manualSplitMax = gm.layers.length - 1;\n    R.manualSplitValue = Math.min(gm.layers.length - 1, cfg.manualSplit);\n    R.manualSplitLabel = R.manualSplitValue + ' / ' + gm.layers.length;\n    R.onManualSplit = (e) => this.setCfg({ manualSplit: Math.round(this.num(e)) });\n\n    // simulation\n    const active = metrics.filter(m => m);\n    const meanE2e = active.length ? active.reduce((a, m) => a + m.e2e, 0) / active.length : 0;\n    R.simTiles = [\n      { label: 'Aggregate FPS', value: this.f1(agg), unit: 'fps', color: 'var(--data)' },\n      { label: 'Active clusters', value: active.length + '', unit: 'of ' + clusters.length, color: 'var(--ink)' },\n      { label: 'Mean e2e latency', value: this.f0(meanE2e), unit: 'ms', color: 'var(--ink)' },\n      { label: 'Auto-balance', value: cfg.autoBalance === 'latency' ? 'Latency' : 'Power', unit: cfg.manualEnabled ? '(manual)' : '', color: 'var(--server)' },\n    ];\n    R.timeline = clusters.map((cl, i) => { const m = metrics[i]; if (!m) return null; const tot = m.e2e || 1;\n      return { id: cl.id, e2eMs: this.f0(m.e2e), fps: this.f1(m.fps),\n        edgeW: (m.edgeMs / tot * 100).toFixed(1) + '%', transferW: (m.transferMs / tot * 100).toFixed(1) + '%', cloudW: (m.cloudMs / tot * 100).toFixed(1) + '%',\n        edgeLabel: m.edgeMs >= tot * 0.12 ? this.f0(m.edgeMs) : '', transferLabel: m.transferMs >= tot * 0.12 ? this.f0(m.transferMs) : '', cloudLabel: m.cloudMs >= tot * 0.12 ? this.f0(m.cloudMs) : '' };\n    }).filter(Boolean);\n    const avg = (sel) => active.length ? active.reduce((a, m) => a + sel(m), 0) / active.length : 0;\n    R.utilBars = [\n      { label: 'Edge compute', color: 'var(--edge)', v: avg(m => m.edgeUtil) },\n      { label: 'Transfer', color: 'var(--data)', v: avg(m => m.transferUtil) },\n      { label: 'Cloud compute', color: 'var(--cloud)', v: avg(m => m.cloudUtil) },\n    ].map(u => ({ ...u, pct: this.f0(u.v * 100), w: Math.min(100, u.v * 100).toFixed(1) + '%' }));\n    const drows = [];\n    clusters.forEach((cl, i) => { const m = metrics[i]; if (!m) return;\n      cl.edges.forEach(d => drows.push({ name: d.name, cluster: cl.id, color: 'var(--edge)', v: m.edgeUtil }));\n      cl.clouds.forEach(d => drows.push({ name: d.name, cluster: cl.id, color: 'var(--cloud)', v: m.cloudUtil }));\n    });\n    R.deviceUtil = drows.map(d => ({ ...d, pct: this.f0(d.v * 100), w: Math.min(100, d.v * 100).toFixed(1) + '%' }));\n    R.breakdown = clusters.map((cl, i) => { const m = metrics[i]; if (!m) return null;\n      return { id: cl.id, edgeG: this.f0(m.edgeG), cloudG: this.f0(m.cloudG), cut: m.cut, msg: this.fmtMsg(m.msg), fps: this.f1(m.fps) };\n    }).filter(Boolean);\n    R.log = st.log.length ? st.log : ['No run yet — press \"Run simulation\".'];\n\n    // detail\n    if (st.detailId != null) {\n      let found = null, stage = null;\n      stages.forEach(s => s.devices.forEach(d => { if (d.id === st.detailId) { found = d; stage = s; } }));\n      if (found) {\n        const cl = clusters.find(c => c.edges.concat(c.clouds).some(d => d.id === found.id));\n        const isCloud = stage.kind === 'Cloud';\n        R.detail = {\n          name: found.name, color: this.kindColor(stage.kind), glyph: this.kindGlyph(stage.kind), isEdge: stage.kind === 'Edge', notEdge: stage.kind !== 'Edge',\n          stageName: stage.name, roleLabel: isCloud ? 'Cloud / tail device' : stage.kind + ' / head device',\n          cluster: found.cluster, queue: cl ? cl.queue : 'unassigned',\n          onBack: () => this.closeDetail(),\n          stats: [\n            { label: 'Compute', value: this.f0(found.gflops), unit: 'GFLOPS' },\n            { label: 'Uplink to queue', value: this.f0(found.bw), unit: 'MB/s' },\n            { label: 'Latency to queue', value: this.f1(found.lat), unit: 'ms' },\n            { label: 'Cluster', value: found.cluster + '', unit: '' },\n          ],\n          narrative: isCloud\n            ? found.name + ' consumes feature maps from ' + (cl ? cl.queue : 'its queue') + ', decompresses them, runs layers[cut:] plus NMS post-processing, and emits detections. It publishes one DONE per batch to fps_queue.'\n            : found.name + ' captures frames, runs layers[:cut], compresses the intermediate feature map, and publishes to ' + (cl ? cl.queue : 'its queue') + '. It stalls under back-pressure when the queue is too deep.',\n        };\n      } else {\n        R.detail = { name: '—', color: 'var(--muted)', glyph: '?', stageName: 'stage', roleLabel: 'unknown', cluster: 0, queue: '—', onBack: () => this.closeDetail(), stats: [], narrative: 'Device not found.' };\n      }\n    } else {\n      R.detail = { onBack: () => this.closeDetail(), stats: [], name: '', color: 'var(--muted)', glyph: '', stageName: '', roleLabel: '', cluster: 0, queue: '', narrative: '' };\n    }\n\n    return R;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
