  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"26331aad-3e8a-4d40-a652-a4c2362f8dd4\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    font-family: system-ui, \"Segoe UI\", Roboto, sans-serif;\n    background: var(--bg);\n    color: var(--ink);\n    -webkit-font-smoothing: antialiased;\n  }\n  :root {\n    --edge:#0E7490; --cloud:#7C3AED; --server:#B45309; --broker:#475569;\n    --data:#15803D; --alert:#B91C1C; --ink:#1E293B; --bg:#FFFFFF;\n    --surface:#F8FAFC; --border:#E2E8F0; --muted:#64748B; --raised:#FFFFFF;\n  }\n  @media (prefers-color-scheme: dark) {\n    :root {\n      --edge:#22D3EE; --cloud:#A78BFA; --server:#FBBF24; --broker:#94A3B8;\n      --data:#4ADE80; --alert:#F87171; --ink:#E2E8F0; --bg:#0F172A;\n      --surface:#1E293B; --border:#334155; --muted:#94A3B8; --raised:#172033;\n    }\n  }\n  [data-theme=\"light\"] {\n    --edge:#0E7490; --cloud:#7C3AED; --server:#B45309; --broker:#475569;\n    --data:#15803D; --alert:#B91C1C; --ink:#1E293B; --bg:#FFFFFF;\n    --surface:#F8FAFC; --border:#E2E8F0; --muted:#64748B; --raised:#FFFFFF;\n  }\n  [data-theme=\"dark\"] {\n    --edge:#22D3EE; --cloud:#A78BFA; --server:#FBBF24; --broker:#94A3B8;\n    --data:#4ADE80; --alert:#F87171; --ink:#E2E8F0; --bg:#0F172A;\n    --surface:#1E293B; --border:#334155; --muted:#94A3B8; --raised:#172033;\n  }\n  input, select, button { font-family: inherit; }\n  input[type=number]::-webkit-inner-spin-button { opacity: .4; }\n  ::-webkit-scrollbar { height: 10px; width: 10px; }\n  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }\n  a { color: var(--edge); }\n  a:hover { color: var(--server); }\n  @keyframes siPulse { 0%,100%{ box-shadow: 0 0 0 0 rgba(185,28,28,0); } 50%{ box-shadow: 0 0 0 6px rgba(185,28,28,.18); } }\n  @keyframes siPop { 0%{ opacity:.25; transform:scale(.9); } 100%{ opacity:1; transform:scale(1); } }\n  @keyframes siGlow { 0%{ opacity:.4; } 100%{ opacity:1; } }\n  .num { font-variant-numeric: tabular-nums; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-theme=\"{{ theme }}\" style=\"min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--ink);\">\n\n  <header style=\"display:flex; align-items:center; gap:16px; padding:12px 20px; border-bottom:1px solid var(--border); background:var(--raised); position:sticky; top:0; z-index:20;\">\n    <div style=\"display:flex; align-items:center; gap:10px; min-width:0;\">\n      <div style=\"width:34px; height:34px; border-radius:9px; overflow:hidden; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid var(--border);\"><img src=\"af163816-eb31-4fe2-a16b-14fad873d88f\" alt=\"logo\" style=\"width:100%; height:100%; object-fit:contain;\"><\u002Fdiv>\n      <div style=\"min-width:0;\">\n        <div style=\"font-weight:700; font-size:15px; line-height:1.1;\">Split Inference Studio<\u002Fdiv>\n        <div style=\"font-size:11px; color:var(--muted);\">Distributed AI inference — simulate &amp; visualize<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;\"><\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:flex-end;\">\n      <div style=\"display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:5px 9px;\">\n        <span style=\"font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;\">Model<\u002Fspan>\n        <sc-raw-select value=\"{{ config.modelName }}\" sc-camel-on-change=\"{{ onModel }}\" style=\"background:transparent; border:none; color:var(--ink); font-size:13px; font-weight:600; outline:none; cursor:pointer;\">\n          <sc-for list=\"{{ modelOptions }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <option value=\"{{ m.value }}\">{{ m.label }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ onRun }}\" style=\"display:flex; align-items:center; gap:7px; background:var(--server); color:#fff; border:none; border-radius:9px; padding:8px 15px; font-size:13px; font-weight:700; cursor:pointer;\">\n        <span style=\"font-size:11px;\">▶<\u002Fspan> Run simulation\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onExportCsv }}\" style=\"background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:9px; padding:8px 12px; font-size:12px; font-weight:600; cursor:pointer;\">CSV<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onExportJson }}\" style=\"background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:9px; padding:8px 12px; font-size:12px; font-weight:600; cursor:pointer;\">JSON<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onExportMd }}\" title=\"Export a rebuild spec for Claude Code\" style=\"background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:9px; padding:8px 12px; font-size:12px; font-weight:600; cursor:pointer;\">MD<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onToggleTheme }}\" title=\"Toggle theme\" style=\"width:36px; height:36px; background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:9px; font-size:15px; cursor:pointer;\">{{ themeIcon }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"flex:1; display:flex; align-items:stretch; min-height:0;\">\n\n    <nav style=\"width:212px; flex-shrink:0; border-right:1px solid var(--border); background:var(--raised); padding:14px 12px; display:flex; flex-direction:column; gap:4px;\">\n      <sc-for list=\"{{ navItems }}\" as=\"it\" hint-placeholder-count=\"5\">\n        <button sc-camel-on-click=\"{{ it.onClick }}\" style=\"{{ it.style }}\">\n          <span style=\"width:9px; height:9px; border-radius:3px; background:{{ it.color }}; flex-shrink:0;\"><\u002Fspan>\n          <span style=\"flex:1; text-align:left;\">{{ it.label }}<\u002Fspan>\n          <span style=\"font-size:11px; color:var(--muted);\" class=\"num\">{{ it.badge }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n      <div style=\"flex:1;\"><\u002Fdiv>\n      <div style=\"border-top:1px solid var(--border); padding-top:12px; margin-top:8px; display:flex; flex-direction:column; gap:7px;\">\n        <div style=\"font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700;\">Legend<\u002Fdiv>\n        <sc-for list=\"{{ legend }}\" as=\"lg\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted);\">\n            <span style=\"width:14px; height:0; border-top:{{ lg.line }};\"><\u002Fspan>{{ lg.label }}\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fnav><main style=\"flex:1; min-width:0; overflow:auto; padding:22px 26px;\">\n\n      <sc-if value=\"{{ showDetail }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:720px;\">\n          <button sc-camel-on-click=\"{{ detail.onBack }}\" style=\"background:none; border:none; color:var(--edge); font-size:13px; font-weight:600; cursor:pointer; padding:0; margin-bottom:14px;\">← back to {{ detail.stageName }}<\u002Fbutton>\n          <div style=\"display:flex; align-items:center; gap:14px; margin-bottom:20px;\">\n            <div style=\"width:52px; height:52px; border-radius:14px; border:2px solid {{ detail.color }}; display:flex; align-items:center; justify-content:center; font-size:22px; color:{{ detail.color }};\"><sc-if value=\"{{ detail.isEdge }}\" hint-placeholder-val=\"{{ false }}\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"2.5\" y=\"7.5\" width=\"12\" height=\"7\" rx=\"1.6\"><\u002Frect><path d=\"M14.5 9.5 20 7.2 20 14.8 14.5 12.5\"><\u002Fpath><circle cx=\"8\" cy=\"11\" r=\"1.8\"><\u002Fcircle><\u002Fsvg><\u002Fsc-if><sc-if value=\"{{ detail.notEdge }}\" hint-placeholder-val=\"{{ true }}\"><span>{{ detail.glyph }}<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n            <div>\n              <div style=\"font-size:22px; font-weight:800;\">{{ detail.name }}<\u002Fdiv>\n              <div style=\"font-size:13px; color:var(--muted);\">{{ detail.roleLabel }} · cluster {{ detail.cluster }} · {{ detail.queue }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px;\">\n            <sc-for list=\"{{ detail.stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px;\">\n                <div style=\"font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);\">{{ s.label }}<\u002Fdiv>\n                <div style=\"font-size:22px; font-weight:800; margin-top:4px;\" class=\"num\">{{ s.value }}<span style=\"font-size:12px; font-weight:600; color:var(--muted);\"> {{ s.unit }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px;\">\n            <div style=\"font-size:13px; font-weight:700; margin-bottom:10px;\">Role in pipeline<\u002Fdiv>\n            <p style=\"margin:0; font-size:13px; color:var(--muted); line-height:1.6;\">{{ detail.narrative }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showMain }}\" hint-placeholder-val=\"{{ true }}\">\n\n        <!-- ============ STAGES ============ -->\n        <sc-if value=\"{{ showStages }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:16px;\">\n            <div>\n              <h1 style=\"margin:0; font-size:20px; font-weight:800;\">Stages &amp; devices<\u002Fh1>\n              <p style=\"margin:4px 0 0; font-size:13px; color:var(--muted); max-width:560px;\">Up to 6 stages (Edge / Fog / Cloud / Custom). Each holds individual devices with their own compute, uplink, and latency to the broker.<\u002Fp>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onAddStage }}\" disabled=\"{{ addStageDisabled }}\" style=\"{{ addStageStyle }}\">+ Add stage<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px;\">\n            <sc-for list=\"{{ stages }}\" as=\"stage\" hint-placeholder-count=\"2\">\n              <div style=\"background:var(--surface); border:1px solid var(--border); border-top:3px solid {{ stage.color }}; border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px;\">\n                <div style=\"display:flex; align-items:center; gap:8px;\">\n                  <sc-if value=\"{{ stage.isEdge }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex; color:{{ stage.color }};\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><rect x=\"2.5\" y=\"7.5\" width=\"12\" height=\"7\" rx=\"1.6\"><\u002Frect><path d=\"M14.5 9.5 20 7.2 20 14.8 14.5 12.5\"><\u002Fpath><circle cx=\"8\" cy=\"11\" r=\"1.8\"><\u002Fcircle><\u002Fsvg><\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ stage.notEdge }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:16px;\">{{ stage.glyph }}<\u002Fspan><\u002Fsc-if>\n                  <input value=\"{{ stage.name }}\" sc-camel-on-change=\"{{ stage.onName }}\" style=\"flex:1; background:transparent; border:none; border-bottom:1px dashed var(--border); color:var(--ink); font-size:15px; font-weight:700; padding:2px 0; outline:none;\">\n                  <sc-raw-select value=\"{{ stage.kind }}\" sc-camel-on-change=\"{{ stage.onKind }}\" style=\"background:var(--bg); border:1px solid var(--border); border-radius:7px; color:{{ stage.color }}; font-size:12px; font-weight:700; padding:4px 6px; cursor:pointer;\">\n                    <sc-for list=\"{{ kinds }}\" as=\"k\" hint-placeholder-count=\"4\"><option value=\"{{ k }}\">{{ k }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <button sc-camel-on-click=\"{{ stage.onRemove }}\" title=\"Remove stage\" style=\"width:26px; height:26px; background:none; border:1px solid var(--border); border-radius:7px; color:var(--muted); cursor:pointer;\">×<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column; gap:8px;\">\n                  <sc-for list=\"{{ stage.devices }}\" as=\"device\" hint-placeholder-count=\"2\">\n                    <div style=\"background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px;\">\n                      <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:8px;\">\n                        <span style=\"width:8px; height:8px; border-radius:50%; background:{{ device.color }};\"><\u002Fspan>\n                        <input value=\"{{ device.name }}\" sc-camel-on-change=\"{{ device.onName }}\" style=\"flex:1; background:transparent; border:none; color:var(--ink); font-size:13px; font-weight:600; outline:none;\">\n                        <button sc-camel-on-click=\"{{ device.onView }}\" style=\"background:none; border:none; color:var(--edge); font-size:11px; font-weight:600; cursor:pointer;\">view only<\u002Fbutton>\n                        <button sc-camel-on-click=\"{{ device.onRemove }}\" title=\"Remove\" style=\"background:none; border:none; color:var(--muted); font-size:15px; cursor:pointer;\">×<\u002Fbutton>\n                      <\u002Fdiv>\n                      <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:7px;\">\n                        <label style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:.03em;\">GFLOPS<\u002Fspan><input type=\"number\" value=\"{{ device.gflops }}\" sc-camel-on-change=\"{{ device.onGflops }}\" style=\"width:100%; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--ink); font-size:12px; padding:4px 5px;\" class=\"num\"><\u002Flabel>\n                        <label style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:.03em;\">MB/s<\u002Fspan><input type=\"number\" value=\"{{ device.bw }}\" sc-camel-on-change=\"{{ device.onBw }}\" style=\"width:100%; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--ink); font-size:12px; padding:4px 5px;\" class=\"num\"><\u002Flabel>\n                        <label style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:.03em;\">Lat ms<\u002Fspan><input type=\"number\" value=\"{{ device.lat }}\" sc-camel-on-change=\"{{ device.onLat }}\" style=\"width:100%; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--ink); font-size:12px; padding:4px 5px;\" class=\"num\"><\u002Flabel>\n                        <label style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-size:9px; text-transform:uppercase; color:var(--muted); letter-spacing:.03em;\">Cluster<\u002Fspan><input type=\"number\" min=\"1\" value=\"{{ device.cluster }}\" sc-camel-on-change=\"{{ device.onCluster }}\" style=\"width:100%; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--ink); font-size:12px; padding:4px 5px;\" class=\"num\"><\u002Flabel>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ stage.onAddDevice }}\" style=\"background:none; border:1px dashed var(--border); border-radius:9px; color:var(--muted); font-size:12px; font-weight:600; padding:8px; cursor:pointer;\">+ Add device<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============ PIPELINE ============ -->\n        <sc-if value=\"{{ showPipeline }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap;\">\n            <div>\n              <h1 style=\"margin:0; font-size:20px; font-weight:800;\">Pipeline diagram<\u002Fh1>\n              <p style=\"margin:4px 0 0; font-size:13px; color:var(--muted); max-width:560px;\">Frames flow left → right across stages; feature maps cross the broker via per-cluster AMQP queues. Click a stage to expand its devices.<\u002Fp>\n            <\u002Fdiv><button sc-camel-on-click=\"{{ onRunFlow }}\" style=\"{{ runFlowStyle }}\">{{ runFlowLabel }}<\u002Fbutton>\n            \n          <\u002Fdiv>\n          <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:18px;\">\n            <div style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;\">\n              <div style=\"font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);\">What is split inference?<\u002Fdiv>\n              <div style=\"display: le><circle cx=\"6.5\" cy=\"17.5\" r=\".9\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                          <div style=\"flex:1;\">\n                            <div style=\"font-size:12px; font-weight:800; line-height:1;\">AMQP Broker<\u002Fdiv>\n                            <div style=\"font-size:9px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);\">RabbitMQ server<\u002Fdiv>\n                          <\u002Fdiv>\n                          <sc-if value=\"{{ flowing }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:8px; height:8px; border-radius:50%; background:var(--data); animation:siGlow .7s ease-in-out infinite alternate;\"><\u002Fspan><\u002Fsc-if>\n                        <\u002Fdiv>\n                        <div style=\"display:flex; flex-direction:column; gap:7px; margin-top:8px;\">\n                          <sc-for list=\"{{ node.queues }}\" as=\"q\" hint-placeholder-count=\"2\">\n                            <div data-queue-cluster=\"{{ q.cluster }}\" style=\"width:100%; border:1px solid {{ q.border }}; border-radius:9px; padding:6px 8px; background:var(--surface);\">\n                              <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;\">\n                                <span style=\"font-size:10px; color:var(--muted);\" class=\"num\">{{ q.name }}<\u002Fspan>\n                                <span style=\"font-size:9px; font-weight:700; color:{{ q.border }};\" class=\"num\">{{ q.rate }}<\u002Fspan>\n                              <\u002Fdiv>\n                              <div style=\"display:flex; gap:2px;\">\n                                <sc-for list=\"{{ q.slots }}\" as=\"slot\" hint-placeholder-count=\"6\">\n                                  <span style=\"flex:1; height:9px; border-radius:2px; background:{{ slot.fill }};\"><\u002Fspan>\n                                <\u002Fsc-for>\n                              <\u002F .expanded }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex; flex-direction:column; gap:6px; margin-top:10px;\">\n                          <sc-for list=\"{{ node.devices }}\" as=\"d\" hint-placeholder-count=\"2\">\n                            <div data-dev-cluster=\"{{ d.effCluster }}\" style=\"display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 8px;\">\n                              <span style=\"width:7px; height:7px; border-radius:50%; background:{{ node.color }};\"><\u002Fspan>\n                              <span style=\"flex:1; font-size:12px; font-weight:600;\">{{ d.name }}<\u002Fspan>\n                              <span style=\"font-size:10px; color:var(--muted);\" class=\"num\">c{{ d.cluster }}<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                          <button sc-camel-on-click=\"{{ node.onAddDevice }}\" style=\"background:none; border:1px dashed var(--border); border-radius:8px; color:var(--muted); font-size:11px; padding:6px; cursor:pointer;\">+ Add device<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            \n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:20px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px;\">\n            <div style=\"font-size:13px; font-weight:700; margin-bottom:4px;\">Queue dependencies<\u002Fdiv>\n            <div style=\"font-size:12px; color:var(--muted); margin-bottom:12px;\">Each cluster owns one intermediate queue: its edge devices publish, its cloud devices consume.<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:10px;\">\n              <sc-f uto-fill,minmax(380px,1fr)); gap:16px;\">\n            <sc-for list=\"{{ clusters }}\" as=\"cl\" hint-placeholder-count=\"2\">\n              <div style=\"background:var(--surface); border:1px solid var(--border); border-left:3px solid {{ cl.border }}; border-radius:14px; padding:16px;\">\n                <div style=\"display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px;\">\n                  <div style=\"font-size:15px; font-weight:800;\">Cluster {{ cl.id }}<\u002Fdiv>\n                  <span style=\"font-family:ui-monospace,monospace; font-size:11px; color:var(--broker); background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:3px 7px;\">{{ cl.queue }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ cl.active }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex; gap:14px; margin-bottom:14px;\">\n                    <div style=\"flex:1;\"><div style=\"font-size:10px; text-transform:uppercase; color:var(--edge); font-weight:700;\">Edge ▲<\u002Fdiv><div style=\"font-size:12px; color:var(--muted);\">{{ cl.edgeNames }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"flex:1;\"><div style=\"font-size:10px; text-transform:uppercase; color:var(--cloud); font-weight:700;\">Cloud ▼<\u002Fdiv><div style=\"font-size:12px; color:var(--muted);\">{{ cl.cloudNames }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;\">\n                    <label style=\"display:flex; flex-direction:column; gap:4px;\"><span style=\"font-size:10px; text-transform:uppercase; color:var(--muted);\">Model<\u002Fspan>\n                      <sc-raw-select value=\"{{ cl.modelName }}\" sc-camel-on-change=\"{{ cl.onModel }}\" style=\"background:var(--bg); border:1px solid var(--border); border-radius:7px; color:var(--ink); font-size:12px; padding:5px; cursor:pointer;\">\n                        <sc-for list=\"{{ modelOptions }}\" as=\"m\" hint-placeholder-count=\"3\"><option value=\"{{ m.value }}\">{{ m.label }}<\u002Foption><\u002Fsc-for>\n                      <\u002Fsc-raw-select><\u002Flabel>\n                    <label style=\"display:flex; flex-direction:column; gap:4px;\"><span style=\"font-size:10px; text-transform:uppercase; color:var(--muted);\">Batch size<\u002Fspan><input type=\"number\" min=\"1\" value=\"{{ cl.batchSize }}\" sc-camel-on-change=\"{{ cl.onBatch }}\" style=\"background:var(--bg); border:1px solid var(--border); border-radius:7px; color:var(--ink); font-size:12px; padding:5px;\" class=\"num\"><\u002Flabel>\n                    <label style=\"display:flex; flex-direction:column; gap:4px;\"><span style=\"font-size:10px; text-transform:uppercase; color:var(--muted);\">Compression — {{ cl.numBit }}-bit<\u002Fspan><input type=\"range\" min=\"1\" max=\"16\" value=\"{{ cl.numBit }}\" sc-camel-on-change=\"{{ cl.onNumBit }}\" sc-camel-on-input=\"{{ cl.onNumBit }}\" style=\"accent-color:var(--data);\"><\u002Flabel>\n                    <label style=\"display:flex; flex-direction:column; gap:4px;\"><span style=\"font-size:10px; text-transform:uppercase; color:var(--muted);\">Cut @ layer {{ cl.cut }}<\u002Fspan><input type=\"range\" min=\"1\" max=\"{{ cl.cutMax }}\" value=\"{{ cl.cut }}\" sc-camel-on-change=\"{{ cl.onSplit }}\" sc-camel-on-input=\"{{ cl.onSplit }}\" style=\"accent-color:var(--edge);\"><\u002Flabel>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; gap:8px; margin-bottom:8px;\">\n                    <div style=\"flex:1; text-align:center; background:var(--bg); border-radius:9px; padding:8px;\"><div style=\"font-size:18px; font-weight:800; color:var(--data);\" class=\"num\">{{ cl.fps }}<\u002Fdiv><div style=\"font-size:10px; color:var(--muted);\">fps<\u002Fdiv><\u002Fdiv>\n                    <div style=\"flex:1; text-align:center; background:var(--bg); border-radius:9px; div style=\"background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px;\">\n                <div style=\"font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);\">{{ t.label }}<\u002Fdiv>\n                <div style=\"font-size:24px; font-weight:800; margin-top:4px; color:{{ t.color }};\" class=\"num\">{{ t.value }}<span style=\"font-size:12px; font-weight:600; color:var(--muted);\"> {{ t.unit }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:20px;\">\n            <div style=\"font-size:13px; font-weight:700; margin-bottom:14px;\">Per-cluster timeline (edge compute · transfer · cloud compute)<\u002Fdiv>\n            <sc-for list=\"{{ timeline }}\" as=\"tl\" hint-placeholder-count=\"2\">\n              <div style=\"margin-bottom:16px;\">\n                <div style=\"display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px;\"><span style=\"font-weight:700;\">Cluster {{ tl.id }}<\u002Fspan><span style=\"color:var(--muted);\" class=\"num\">{{ tl.e2eMs }} ms e2e · {{ tl.fps }} fps<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex; height:26px; border-radius:7px; overflow:hidden; border:1px solid var(--border);\">\n                  <div style=\"width:{{ tl.edgeW }}; background:var(--edge); display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:700; overflow:hidden;\" class=\"num\">{{ tl.edgeLabel }}<\u002Fdiv>\n                  <div style=\"width:{{ tl.transferW }}; background:var(--data); display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:700; overflow:hidden;\" class=\"num\">{{ tl.transferLabel }}<\u002Fdiv>\n                  <div style=\"width:{{ tl.cloudW }}; background:var(--cloud); display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:700; overflow:hidden;\" class=\"num\">{{ tl.cloudLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;\">\n            <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px;\">\n              <div style=\"font-size:13px; font-weight:700; margin-bottom:14px;\">Stage utilization (avg across clusters)<\u002Fdiv>\n              <sc-for list=\"{{ utilBars }}\" as=\"u\" hint-placeholder-count=\"3\">\n                <div style=\"margin-bottom:12px;\">\n                  <div style=\"display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;\"><span>{{ u.label }}<\u002Fspan><span class=\"num\" style=\"color:var(--muted);\">{{ u.pct }}%<\u002Fspan><\u002Fdiv>\n                  <div style=\"height:10px; background:var(--bg); border-radius:6px; overflow:hidden;\"><div style=\"width:{{ u.w }}; height:100%; background:{{ u.color }}; transition:width .25s cubic-bezier(0.2,0,0,1);\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"border-top:1px solid var(--border); margin-top:14px; padding-top:14px;\">\n                <div style=\"font-size:12px; font-weight:700; margin-bottom:10px;\">Per-device utilization<\u002Fdiv>\n                <sc-for list=\"{{ deviceUtil }}\" as=\"d\" hint-placeholder-count=\"3\">\n                  <div style=\"margin-bottom:9px;\">\n                    <div style=\"display:flex; justify-content:space-between; font-size:11px; margin-bottom:3px;\"><span>{{ d.name }} <span style=\"color:var(--muted);\">· c{{ d.cluster }}<\u002Fspan><\u002Fspan><span class=\"num\" style=\"color:var(--muted);\">{{ d.pct }}%<\u002Fspan><\u002Fdiv>\n                    <div style=\"height:7px; background:var(--bg); border-radius:5px; overflow:hidden;\"><div style=\"width:{{ d.w }}; height:100%; background:{{ d.color }};\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px;\">\n              <div style=\"font-size:13px; font-weight:700; margin-bottom:14px;\">Resource breakdown<\u002Fdiv>\n              <div style=\"overflow-x:auto;\">\n                <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:12px;\">\n                  <sc-raw-thead><sc-raw-tr style=\"text-align:right; color:var(--muted);\">\n                    <sc-raw-th style=\"text-align:left; padding:6px 4px; font-weight:600;\">Cluster<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"padding:6px 4px; font-weight:600;\">Edge G<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"padding:6px 4px; font-weight:600;\">Cloud G<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"padding:6px 4px; font-weight:600;\">Cut<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"padding:6px 4px; font-weight:600;\">Msg<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"padding:6px 4px; font-weight:600;\">fps<\u002Fsc-raw-th>\n                  <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ breakdown }}\" as=\"b\" hint-placeholder-count=\"2\">\n                      <sc-raw-tr style=\"text-align:right; border-top:1px solid var(--border);\">\n                        <sc-raw-td style=\"text-align:left; padding:7px 4px; font-weight:700;\">{{ b.id }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:7px 4px;\" class=\"num\">{{ b.edgeG }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:7px 4px;\" class=\"num\">{{ b.cloudG }}<\u002Fsc-raw-td>\n        <button sc-camel-on-click=\"{{ ssh.server.onTest }}\" style=\"background:var(--broker); color:#fff; border:none; border-radius:8px; padding:7px; font-size:11px; font-weight:700; cursor:pointer;\">Test connection<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px;\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n                <div style=\"font-size:13px; font-weight:700;\">Targets<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ ssh.onSelectAll }}\" style=\"background:none; border:none; color:var(--edge); font-size:11px; font-weight:600; cursor:pointer;\">{{ ssh.selectAllLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-for list=\"{{ ssh.groups }}\" as=\"g\" hint-placeholder-count=\"2\">\n                <div>\n                  <div style=\"display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:{{ g.color }}; margin-bottom:6px;\">{{ g.name }}<\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:6px;\">\n                    <sc-for list=\"{{ g.devices }}\" as=\"d\" hint-placeholder-count=\"2\">\n                      <div style=\"{{ d.wrapStyle }}\">\n                      <label sc-camel-on-click=\"{{ d.onToggle }}\" style=\"{{ d.rowStyle }}\">\n                        <span style=\"width:15px; height:15px; border-radius:4px; border:2px solid {{ d.checkColor }}; background:{{ d.checkBg }}; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px;\">{{ d.check }}<\u002Fspan>\n                        <span style=\"flex:1; min-width:0;\">\n                          <span style=\"display:block; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; px; text-transform:uppercase; color:var(--muted);\">Username<\u002Fspan><input value=\"{{ d.user }}\" sc-camel-on-change=\"{{ d.onUser }}\" placeholder=\"root\" style=\"background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--ink); font-family:ui-monospace,monospace; font-size:11px; padding:5px 6px;\"><\u002Flabel>\n                          <label style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-size:9px; text-transform:uppercase; color:var(--muted);\">Password<\u002Fspan><input type=\"password\" value=\"{{ d.password }}\" sc-camel-on-change=\"{{ d.onPassword }}\" placeholder=\"••••••\" style=\"background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--ink); font-family:ui-monospace,monospace; font-size:11px; padding:5px 6px;\"><\u002Flabel>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- command + scp + terminal -->\n            <div style=\"display:flex; flex-direction:column; gap:16px;\">\n\n              <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px;\">\n                <div style=\"font-size:13px; font-weight:700; margin-bottom:10px;\">Run command on {{ ssh.selectedCount }} device(s)<\u002Fdiv>\n                <div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;\">\n                  <sc-for list=\"{{ ssh.presets }}\" as=\"p\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ p.onPick }}\" style=\"{{ p.style }}\">{{ p.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex; gap:8px; align-items:stretch;\">\n                  <span style=\"display:flex; align-items:center; padding:0 10px; background:var(--bg); border:1px solid var(--border); border-right:none; border-radius:9px 0 0 9px; color:var(--data); font-family:ui-monospace,monospace; font-size:13px; font-weight:700;\">$<\u002Fspan>\n                  <input value=\"{{ ssh.command }}\" sc-camel-on-change=\"{{ ssh.onCommand }}\" placeholder=\"type a shell command…\" style=\"flex:1; background:var(--bg); border:1px solid var(--border); border-left:none; border-radius:0; color:var(--ink); font-family:ui-monospace,monospace; font-size:13px; padding:9px 10px; outline:none;\">\n                  <button sc-camel-on-click=\"{{ ssh.onRun }}\" disabled=\"{{ ssh.runDisabled }}\" style=\"{{ ssh.runStyle }}\">▶ Run<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px;\">\n                <div style=\"font-size:13px; font-weight:700; margin-bottom:10px;\">SCP — push file to selected devices<\u002Fdiv>\n                <div style=\"display:grid; grid-template-columns:1fr auto 1fr auto; gap:8px; align-items:center;\">\n                  <label style=\"display:flex; align-items:center; gap:8px; background:var(--bg); border:1px dashed var(--border); border-radius:9px; padding:9px 10px; cursor:pointer; min-width:0;\">\n                    <span style=\"color:var(--edge); font-size:13px;\">⇪<\u002Fspan>\n                    <span style=\"flex:1; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ ssh.scpLocalLabel }}<\u002Fspan>\n                    <input type=\"file\" sc-camel-on-change=\"{{ ssh.onScpFile }}\" style=\"display:none;\">\n                  <\u002Flabel>\n                  <span style=\"color:var(--muted); font-size:14px;\">→<\u002Fspan>\n                  <input value=\"{{ ssh.scpRemote }}\" sc-camel-on-change=\"{{ ssh.onScpRemote }}\" placeholder=\"/remote/path\" style=\"background:var(--bg); border:1px solid var(--border); border-radius:9px; color:var(--ink); font-family:ui-monospace,monospace; font-size:12px; padding:9px 10px; outline:none; min-width:0;\">\n                  <button sc-camel-on-click=\"{{ ssh.onScp }}\" disabled=\"{{ ssh.runDisabled }}\" style=\"{{ ssh.scpStyle }}\">Send<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#0b1020; border:1px solid var(--border); border-radius:14px; padding:14px; min-height:220px;\">\n                <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;\">\n                  <div style=\"display:flex; align-items:center; gap:7px;\">\n                    <span style=\"display:flex; gap:5px;\"><span style=\"width:9px; height:9px; border-radius:50%; background:#f87171;\"><\u002Fspan><span style=\"width:9px; height:9px; border-radius:50%; background:#fbbf24;\"><\u002Fspan><span style=\"width:9px; height:9px; border-radius:50%; background:#4ade80;\"><\u002Fspan><\u002Fspan>\n                    <span style=\"font-size:11px; color:#94A3B8; font-family:ui-monospace,monospace;\">fan-out console<\u002Fspan>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ ssh.onClear }}\" style=\"background:none; border:none; color:#64748b; font-size:11px; cursor:pointer;\">clear<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"max-height:340px; overflow:auto; display:flex; flex-direction:column; gap:2px; font-family:ui-monospace,monospace; font-size:12px; line-height:1.55;\">\n                  <sc-for list=\"{{ ssh.out }}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <div style=\"color:{{ o.color }}; white-space:pre-wrap;\">{{ o.text }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fsc-if>\n    <\u002Fmain>\n\n    \n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;maxMessageMb&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 15, &quot;min&quot;: 1, &quot;max&quot;: 64, &quot;step&quot;: 1, &quot;unit&quot;: &quot; MB&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Simulation&quot;}, &quot;defaultBatchSize&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 32, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Simulation&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    active: 'stages',\n    theme: 'light',\n    detailId: null,\n    expanded: {},\n    stages: null,\n    config: { clustering: true, numClusters: 2, autoBalance: 'power', manualEnabled: false, manualSplit: 5, modelName: 'yolov11n' },\n    clusterCfg: {},\n    uploadedModel: null,\n    log: [],\n    ran: false,\n    flowing: false,\n    ssh: { selected: [], status: {}, conn: {}, editing: null, command: 'nvidia-smi', custom: '', scpLocal: '', scpRemote: '/opt/models/head.pt', out: [], busy: false,\n      server: { ip: '10.0.0.5', port: 5672, user: 'admin', password: '', status: 'off', editing: false } },\n  };\n\n  componentDidMount() {\n    try { if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) this.setState({ theme: 'dark' }); } catch (e) {}\n    if (!this.state.stages) this.setState({ stages: this.defaultStages() });\n    this._onResize = () => this.scheduleWires();\n    window.addEventListener('resize', this._onResize);\n    this.scheduleWires();\n  }\n  componentDidUpdate() { this.scheduleWires(); }\n  componentWillUnmount() { window.removeEventListener('resize', this._onResize); cancelAnimationFrame(this._raf); }\n  scheduleWires() {\n    const run = () => this.drawWires();\n    requestAnimationFrame(() => requestAnimationFrame(run));\n    setTimeout(run, 0);\n    setTimeout(run, 120);\n  }\n  drawWires() {\n    if (this.state.active !== 'pipeline') return;\n    const wrap = document.querySelector('[data-wire-wrap]');\n    const svg = wrap && wrap.querySelector('[data-wire-svg]');\n    if (!wrap || !svg) return;\n    const wr = wrap.getBoundingClientRect();\n    const W = wrap.scrollWidth, H = wrap.scrollHeight;\n    svg.setAttribute('width', W); svg.setAttribute('height', H);\n    svg.style.width = W + 'px'; svg.style.height = H + 'px';\n    while (svg.firstChild) svg.removeChild(svg.firstChild);\n    this._paths = [];\n    const palette = ['var(--edge)', 'var(--cloud)', 'var(--server)', 'var(--data)', 'var(--broker)', 'var(--alert)'];\n    const rel = (el) => { const r = el.getBoundingClientRect(); return { left: r.left - wr.left, right: r.right - wr.left, midY: (r.top + r.bottom) / 2 - wr.top }; };\n    const stageNodes = Array.prototype.slice.call(wrap.querySelectorAll('[data-side]'));\n    const queues = Array.prototype.slice.call(wrap.querySelectorAll('[data-queue-cluster]'));\n    queues.forEach(qEl => {\n      const k = +qEl.getAttribute('data-queue-cluster');\n      const color = palette[(k - 1) % 6];\n      const q = rel(qEl);\n      stageNodes.forEach(sn => {\n        const cl = (sn.getAttribute('data-clusters') || '').split(',').filter(Boolean).map(Number);\n        if (cl.indexOf(k) < 0) return;\n        const side = sn.getAttribute('data-side');\n        const chips = Array.prototype.slice.call(sn.querySelectorAll('[data-dev-cluster=\"' + k + '\"]'));\n        const anchors = chips.length ? chips : [sn];\n        anchors.forEach(a => {\n          const s = rel(a);\n          if (side === 'edge') this.wire(svg, s.right, s.midY, q.left, q.midY, color, k);\n          else this.wire(svg, q.right, q.midY, s.left, s.midY, color, k);\n        });\n      });\n    });\n    if (this.state.flowing) this.startFlow(); else this.stopFlow();\n  }\n  wire(svg, x1, y1, x2, y2, color, cluster) {\n    const NS = 'http://www.w3.org/2000/svg';\n    const dx = Math.max(24, (x2 - x1) * 0.45);\n    const p = document.createElementNS(NS, 'path');\n    p.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' ' + (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2);\n    p.setAttribute('fill', 'none');\n    p.style.stroke = color; p.style.strokeWidth = '2'; p.style.opacity = '.8'; p.style.strokeLinecap = 'round';\n    svg.appendChild(p);\n    [[x1, y1], [x2, y2]].forEach(pt => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', pt[0]); c.setAttribute('cy', pt[1]); c.setAttribute('r', '3'); c.style.fill = color; svg.appendChild(c); });\n    this._paths.push({ el: p, color, cluster, len: p.getTotalLength() });\n  }\n  startFlow() {\n    this.stopFlow();\n    const svg = document.querySelector('[data-wire-svg]');\n    if (!svg || !this._paths || !this._paths.length) return;\n    const NS = 'http://www.w3.org/2000/svg';\n    const packets = [];\n    this._paths.forEach(pth => {\n      for (let i = 0; i < 2; i++) {\n        const dot = document.createElementNS(NS, 'circle');\n        dot.setAttribute('r', '4.5'); dot.style.fill = pth.color;\n        dot.style.filter = 'drop-shadow(0 0 4px ' + pth.color + ')';\n        svg.appendChild(dot);\n        packets.push({ dot, path: pth.el, len: pth.len, t: i * 0.5 });\n      }\n    });\n    this._packets = packets;\n    let last = performance.now();\n    const step = (now) => {\n      const dt = Math.min(0.05, (now - last) / 1000); last = now;\n      packets.forEach(pk => {\n        pk.t += dt * 0.55; if (pk.t > 1) pk.t -= 1;\n        const pt = pk.path.getPointAtLength(pk.t * pk.len);\n        pk.dot.setAttribute('cx', pt.x); pk.dot.setAttribute('cy', pt.y);\n        pk.dot.style.opacity = (Math.sin(pk.t * Math.PI) * 0.7 + 0.3).toFixed(2);\n      });\n      this._flowRaf = requestAnimationFrame(step);\n    };\n    this._flowRaf = requestAnimationFrame(step);\n  }\n  stopFlow() {\n    cancelAnimationFrame(this._flowRaf);\n    if (this._packets) { this._packets.forEach(pk => { if (pk.dot.parentNode) pk.dot.parentNode.removeChild(pk.dot); }); this._packets = null; }\n  }\n\n  // ---------- defaults ----------\n  nid(p) { return p + Math.random().toString(36).slice(2, 7); }\n  dev(name, gflops, bw, lat, cluster) { return { id: this.nid('d'), name, gflops, bw, lat, cluster }; }\n  defaultStages() {\n    return [\n      { id: this.nid('s'), kind: 'Edge', name: 'Edge', devices: [\n        this.dev('Jetson-A', 472, 12, 6, 1), this.dev('Jetson-B', 472, 12, 6, 1), this.dev('Jetson-C', 384, 10, 8, 2) ] },\n      { id: this.nid('s'), kind: 'Cloud', name: 'Cloud', devices: [\n        this.dev('GPU-1', 9800, 125, 2, 1), this.dev('GPU-2', 9800, 125, 2, 2) ] },\n    ];\n  }\n\n  // ---------- models ----------\n  baseLayers() {\n    return [\n      { name: 'Conv-0', flops: 0.35, bytes: 3211264 },\n      { name: 'Conv-1', flops: 0.52, bytes: 1605632 },\n      { name: 'C3k2-2', flops: 0.78, bytes: 1605632 },\n      { name: 'Conv-3', flops: 0.61, bytes: 802816 },\n      { name: 'C3k2-4', flops: 0.94, bytes: 802816 },\n      { name: 'Conv-5', flops: 0.55, bytes: 401408 },\n      { name: 'C3k2-6', flops: 0.72, bytes: 401408 },\n      { name: 'Conv-7', flops: 0.48, bytes: 200704 },\n      { name: 'C3k2-8', flops: 0.66, bytes: 200704 },\n      { name: 'SPPF-9', flops: 0.39, bytes: 200704 },\n      { name: 'C2PSA-10', flops: 0.42, bytes: 200704 },\n      { name: 'Head-11', flops: 0.58, bytes: 100352 },\n    ];\n  }\n  models() {\n    const base = this.baseLayers();\n    const scale = (f) => base.map(l => ({ name: l.name, flops: +(l.flops * f).toFixed(3), bytes: Math.round(l.bytes * Math.min(1.6, f)) }));\n    const m = {\n      yolov11n: { label: 'YOLOv11n', layers: base },\n      yolov11s: { label: 'YOLOv11s', layers: scale(2.6) },\n      yolo26n: { label: 'YOLO26n', layers: scale(1.15) },\n    };\n    if (this.state.uploadedModel) m.uploaded = this.state.uploadedModel;\n    return m;\n  }\n  getModel(name) { const m = this.models(); return m[name] || m[this.state.config.modelName] || m.yolov11n; }\n  modelOptions() {\n    const m = this.models();\n    return Object.keys(m).map(k => ({ value: k, label: m[k].label }));\n  }\n\n  // ---------- helpers ----------\n  maxMb() { return this.props.maxMessageMb ?? 15; }\n  factor(nb) { return (nb / 32) * 0.65; }\n  msgMB(bytes, nb) { return bytes * this.factor(nb) / 1e6; }\n  f1(x) { return (x == null || isNaN(x)) ? '—' : (+x).toFixed(1); }\n  f0(x) { return (x == null || isNaN(x)) ? '—' : Math.round(+x).toLocaleString(); }\n  fmtMsg(mb) { return mb < 1 ? Math.round(mb * 1024) + ' KB' : mb.toFixed(2) + ' MB'; }\n  kindColor(k) { return k === 'Cloud' ? 'var(--cloud)' : k === 'Fog' ? 'var(--server)' : k === 'Custom' ? 'var(--broker)' : 'var(--edge)'; }\n  kindGlyph(k) { return k === 'Cloud' ? '☁' : k === 'Fog' ? '◈' : k === 'Custom' ? '▣' : '📷'; }\n  num(e) { const v = parseFloat(e.target.value); return isNaN(v) ? 0 : v; }\n\n  // ---------- state mutators ----------\n  setCfg(patch) { this.setState(s => ({ config: { ...s.config, ...patch } })); }\n  updateStage(id, patch) { this.setState(s => ({ stages: s.stages.map(st => st.id === id ? { ...st, ...patch } : st) })); }\n  removeStage(id) { this.setState(s => ({ stages: s.stages.filter(st => st.id !== id) })); }\n  addStage() {\n    this.setState(s => {\n      if (s.stages.length >= 6) return {};\n      return { stages: [...s.stages, { id: this.nid('s'), kind: 'Custom', name: 'Stage ' + (s.stages.length + 1), devices: [this.dev('device-1', 1000, 50, 4, 1)] }] };\n    });\n  }\n  addDevice(stageId) {\n    this.setState(s => ({ stages: s.stages.map(st => st.id === stageId ? { ...st, devices: [...st.devices, this.dev('device-' + (st.devices.length + 1), st.kind === 'Cloud' ? 9800 : 472, st.kind === 'Cloud' ? 125 : 12, 4, 1)] } : st) }));\n  }\n  removeDevice(stageId, id) { this.setState(s => ({ stages: s.stages.map(st => st.id === stageId ? { ...st, devices: st.devices.filter(d => d.id !== id) } : st) })); }\n  updateDevice(stageId, id, patch) { this.setState(s => ({ stages: s.stages.map(st => st.id === stageId ? { ...st, devices: st.devices.map(d => d.id === id ? { ...d, ...patch } : d) } : st) })); }\n  setClusterCfg(id, patch) { this.setState(s => ({ clusterCfg: { ...s.clusterCfg, [id]: { ...(s.clusterCfg[id] || {}), ...patch } } })); }\n\n  clusterConfig(id) {\n    const c = this.state.clusterCfg[id] || {};\n    return { modelName: c.modelName || this.state.config.modelName, batchSize: c.batchSize || (this.props.defaultBatchSize ?? 32), numBit: c.numBit || 8, splitOverride: c.splitOverride == null ? null : c.splitOverride };\n  }\n\n  // ---------- cluster building ----------\n  buildClusters() {\n    const cfg = this.state.config;\n    const stages = this.state.stages || [];\n    const all = [];\n    stages.forEach(st => st.devices.forEach(d => all.push({ ...d, side: st.kind === 'Cloud' ? 'cloud' : 'edge', stageId: st.id, stageName: st.name, stageKind: st.kind })));\n    let groups;\n    if (cfg.clustering) {\n      const K = Math.max(1, cfg.numClusters);\n      groups = []; for (let k = 1; k <= K; k++) groups.push({ id: k, edges: [], clouds: [] });\n      all.forEach(d => { const k = Math.min(K, Math.max(1, Math.round(d.cluster || 1))); (d.side === 'cloud' ? groups[k - 1].clouds : groups[k - 1].edges).push(d); });\n    } else {\n      groups = [{ id: 1, edges: all.filter(d => d.side !== 'cloud'), clouds: all.filter(d => d.side === 'cloud') }];\n    }\n    return groups.map(g => ({ ...g, cfg: this.clusterConfig(g.id), queue: 'intermediate_queue_' + g.id }));\n  }\n\n  // ---------- cut selection + simulation ----------\n  prefix(layers) { const c = [0]; for (let i = 0; i < layers.length; i++) c[i + 1] = c[i] + layers[i].flops; return c; }\n  safeCuts(layers, nb) { const out = []; for (let c = 1; c < layers.length; c++) if (this.msgMB(layers[c - 1].bytes, nb) <= this.maxMb()) out.push(c); return out; }\n  chooseCut(layers, edgeG, cloudG, mode, nb, bw, lat) {\n    const cum = this.prefix(layers), total = cum[layers.length];\n    const safe = this.safeCuts(layers, nb);\n    const cand = safe.length ? safe : [layers.length - 1];\n    if (mode === 'latency') {\n      let best = cand[0], bestE = Infinity;\n      for (const c of cand) { const e = this.e2eAt(layers, cum, total, c, edgeG, cloudG, nb, bw, lat).e2e; if (e < bestE) { bestE = e; best = c; } }\n      return best;\n    }\n    const share = edgeG / (edgeG + cloudG);\n    let best = cand[0], bestD = Infinity;\n    for (const c of cand) { const d = Math.abs(cum[c] / total - share); if (d < bestD) { bestD = d; best = c; } }\n    return best;\n  }\n  e2eAt(layers, cum, total, c, edgeG, cloudG, nb, bw, lat) {\n    const edgeMs = cum[c] / edgeG * 1000;\n    const cloudMs = (total - cum[c]) / cloudG * 1000;\n    const msg = this.msgMB(layers[c - 1].bytes, nb);\n    const transferMs = (msg / bw) * 1000 + lat;\n    const bottleneck = Math.max(edgeMs, transferMs, cloudMs);\n    return { edgeMs, cloudMs, transferMs, msg, e2e: edgeMs + transferMs + cloudMs, bottleneck, fps: 1000 / bottleneck };\n  }\n  simCluster(cl) {\n    if (!cl.edges.length || !cl.clouds.length) return null;\n    const layers = this.getModel(cl.cfg.modelName).layers;\n    const cum = this.prefix(layers), total = cum[layers.length];\n    const edgeG = cl.edges.reduce((a, d) => a + (+d.gflops || 0), 0);\n    const cloudG = cl.clouds.reduce((a, d) => a + (+d.gflops || 0), 0);\n    const bw = Math.min.apply(null, cl.edges.map(d => +d.bw || 1));\n    const lat = (cl.edges.reduce((a, d) => a + (+d.lat || 0), 0) / cl.edges.length) + (cl.clouds.reduce((a, d) => a + (+d.lat || 0), 0) / cl.clouds.length);\n    let cut, guardHit = false;\n    if (cl.cfg.splitOverride != null) {\n      cut = Math.min(layers.length - 1, Math.max(1, cl.cfg.splitOverride));\n    } else if (this.state.config.manualEnabled) {\n      cut = Math.min(layers.length - 1, Math.max(1, this.state.config.manualSplit));\n    } else {\n      cut = this.chooseCut(layers, edgeG || 1, cloudG || 1, this.state.config.autoBalance, cl.cfg.numBit, bw, lat);\n    }\n    const safe = this.safeCuts(layers, cl.cfg.numBit);\n    if (safe.length && safe.indexOf(cut) === -1 && this.msgMB(layers[cut - 1].bytes, cl.cfg.numBit) > this.maxMb()) { guardHit = true; cut = safe[0]; }\n    const m = this.e2eAt(layers, cum, total, cut, edgeG || 1, cloudG || 1, cl.cfg.numBit, bw, lat);\n    return { ...m, cut, edgeG, cloudG, bw, lat, total, layerCount: layers.length, guardHit,\n      edgeUtil: m.edgeMs / m.bottleneck, transferUtil: m.transferMs / m.bottleneck, cloudUtil: m.cloudMs / m.bottleneck };\n  }\n\n  // ---------- actions ----------\n  runSim() {\n    const clusters = this.buildClusters();\n    const log = [];\n    log.push('▶ run · ' + new Date().toLocaleTimeString() + ' · mode=' + this.state.config.autoBalance + (this.state.config.manualEnabled ? ' (manual override)' : ''));\n    let agg = 0;\n    clusters.forEach(cl => {\n      const m = this.simCluster(cl);\n      if (!m) { log.push('cluster ' + cl.id + ': idle (needs edge + cloud device)'); return; }\n      agg += m.fps;\n      log.push('cluster ' + cl.id + ': cut@' + m.cut + '/' + m.layerCount + ' · msg ' + this.fmtMsg(m.msg) + ' · ' + this.f1(m.fps) + ' fps' + (m.guardHit ? ' · ⃠ guard' : ''));\n    });\n    log.push('Σ aggregate throughput = ' + this.f1(agg) + ' fps');\n    this.setState({ ran: true, active: 'simulation', flowing: true, log: log });\n  }\n  runFlow() {\n    if (this.state.flowing) { this.setState({ flowing: false }); return; }\n    this.runSim();\n    this.setState({ active: 'pipeline', flowing: true });\n  }\n  toggleTheme() { this.setState(s => ({ theme: s.theme === 'dark' ? 'light' : 'dark' })); }\n  openDetail(id) { this.setState({ detailId: id }); }\n  closeDetail() { this.setState({ detailId: null }); }\n\n  download(name, text, type) {\n    try {\n      const blob = new Blob([text], { type });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();\n      setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 100);\n    } catch (e) {}\n  }\n  exportJson() {\n    const clusters = this.buildClusters().map(cl => { const m = this.simCluster(cl); return { id: cl.id, queue: cl.queue, config: cl.cfg, edges: cl.edges.map(d => d.name), clouds: cl.clouds.map(d => d.name), metrics: m && { cut: m.cut, edgeMs: +m.edgeMs.toFixed(2), transferMs: +m.transferMs.toFixed(2), cloudMs: +m.cloudMs.toFixed(2), e2eMs: +m.e2e.toFixed(2), msgMB: +m.msg.toFixed(3), fps: +m.fps.toFixed(2) } }; });\n    const out = { model: this.state.config.modelName, config: this.state.config, stages: this.state.stages, clusters };\n    this.download('split_inference_pipeline.json', JSON.stringify(out, null, 2), 'application/json');\n  }\n  exportCsv() {\n    const rows = [['cluster', 'queue', 'model', 'batch_size', 'num_bit', 'best_cut', 'edge_gflops', 'cloud_gflops', 'bandwidth_mb_s', 'latency_ms', 'edge_ms', 'transfer_ms', 'cloud_ms', 'e2e_ms', 'msg_mb', 'fps']];\n    this.buildClusters().forEach(cl => { const m = this.simCluster(cl); if (!m) return; rows.push([cl.id, cl.queue, cl.cfg.modelName, cl.cfg.batchSize, cl.cfg.numBit, m.cut, m.edgeG, m.cloudG, m.bw, m.lat.toFixed(1), m.edgeMs.toFixed(2), m.transferMs.toFixed(2), m.cloudMs.toFixed(2), m.e2e.toFixed(2), m.msg.toFixed(3), m.fps.toFixed(2)]); });\n    this.download('split_inference_metrics.csv', rows.map(r => r.join(',')).join('\\n'), 'text/csv');\n  }\n  exportMd() {\n    const st = this.state, cfg = st.config;\n    const clusters = this.buildClusters();\n    const metrics = clusters.map(cl => this.simCluster(cl));\n    let agg = 0; metrics.forEach(m => { if (m) agg += m.fps; });\n    const L = [];\n    L.push('# Split Inference Simulation Platform — Rebuild Spec');\n    L.push('');\n    L.push('> Generated ' + new Date().toISOString() + ' from the running app. Hand this file to Claude Code to rebuild the project. It captures the architecture, the simulation math, and the exact current scenario.');\n    L.push('');\n    L.push('## 1. What this is');\n    L.push('A client-side, single-HTML-file platform that simulates and visualizes **split inference** for distributed AI (YOLO-style object detection). Users define compute stages and devices, choose a partitioning strategy, and simulate a per-batch pipeline: edge devices run `layers[:cut]`, publish a compressed feature map to an AMQP broker queue, and cloud devices run `layers[cut:]` + NMS post-processing.');\n    L.push('');\n    L.push('## 2. Hard requirements');\n    L.push('- Single self-contained HTML file, runs client-side, no backend, no build step.');\n    L.push('- Swappable built-in strategies (not plugins).');\n    L.push('- Stages capped at **6** (Edge / Fog / Cloud / Custom).');\n    L.push('- Export **CSV, JSON, and this Markdown** spec.');\n    L.push('- Each stage holds individual devices; each device has its own GFLOPS, bandwidth-to-queue (MB/s), latency-to-queue (ms), and cluster-ID.');\n    L.push('- Light + dark theming.');\n    L.push('');\n    L.push('## 3. Sections (UI)');\n    L.push('1. **Stages** — add/remove up to 6 stages; per-device GFLOPS / bandwidth / latency / cluster-ID; per-device \"view only\" detail view with back-to-stage.');\n    L.push('2. **Pipeline** — edge stages (left) → single central AMQP broker band with per-cluster queues → cloud stages (right). Expand a stage to see its devices. **Per-cluster colored wires** connect each edge device to its cluster queue and each queue to its cloud devices (one line per device; falls back to a stage-level line when collapsed). A queue-dependency panel lists publishers/consumers per queue.');\n    L.push('3. **Config** — clustering toggle + number of clusters; auto-balance mode (power-proportional / latency-minimizing); model picker + upload; manual split override.');\n    L.push('4. **Clusters** — per-cluster independent model / batch size / compression (num-bit) / cut; live fps, e2e ms, message size; aggregate throughput.');\n    L.push('5. **Simulation** — summary tiles, per-cluster timeline (edge compute · transfer · cloud compute, scaled independently), stage + per-device utilization bars, resource breakdown table, event log.');\n    L.push('');\n    L.push('## 4. Simulation model (illustrative)');\n    L.push('For a cluster with aggregate edge GFLOPS `E`, aggregate cloud GFLOPS `C`, min edge uplink `B` MB/s, mean latency `Lat` ms, model layers with per-layer `flops` (GFLOP) and `bytes` (feature-map size), compression `nb` bits:');\n    L.push('```');\n    L.push('compressionFactor = (nb / 32) * 0.65');\n    L.push('msgMB(cut)   = layers[cut-1].bytes * compressionFactor / 1e6');\n    L.push('edgeMs       = sum(flops[:cut]) / E * 1000');\n    L.push('cloudMs      = sum(flops[cut:]) / C * 1000');\n    L.push('transferMs   = msgMB / B * 1000 + Lat');\n    L.push('e2eMs        = edgeMs + transferMs + cloudMs');\n    L.push('bottleneckMs = max(edgeMs, transferMs, cloudMs)   // pipelined throughput');\n    L.push('fps          = 1000 / bottleneckMs');\n    L.push('```');\n    L.push('**Message-size guard:** cuts whose `msgMB` exceeds `maxMessageMb` (currently **' + this.maxMb() + ' MB**) are excluded; if the chosen cut violates it, fall back to the shallowest safe cut and flag the guard.');\n    L.push('');\n    L.push('### Auto-balance modes');\n    L.push('- **Power-proportional:** pick the cut whose cumulative edge FLOPs fraction is closest to `E / (E + C)` (stronger side gets proportionally more work).');\n    L.push('- **Latency-minimizing:** sweep all safe cuts, pick the one with the lowest `e2eMs`.');\n    L.push('- **Manual override** (global or per-cluster) pins the cut directly.');\n    L.push('');\n    L.push('### Clustering');\n    L.push('Many edge devices pair with many cloud devices in parallel. Each device carries a cluster-ID; devices with the same ID form one cluster that owns one intermediate queue (`intermediate_queue_<id>`): its edge devices publish, its cloud devices consume. Each cluster runs its own model/batch/compression/cut independently. Aggregate throughput = sum of per-cluster fps.');\n    L.push('');\n    L.push('## 5. Design tokens');\n    L.push('| Role | Light | Dark |');\n    L.push('|---|---|---|');\n    L.push('| Edge | `#0E7490` | `#22D3EE` |');\n    L.push('| Cloud | `#7C3AED` | `#A78BFA` |');\n    L.push('| Server/Fog | `#B45309` | `#FBBF24` |');\n    L.push('| Broker/queue | `#475569` | `#94A3B8` |');\n    L.push('| Feature map/data | `#15803D` | `#4ADE80` |');\n    L.push('| Alert | `#B91C1C` | `#F87171` |');\n    L.push('Edge devices use a CCTV/traffic-camera icon; cloud uses ☁; fog ◈; custom ▣.');\n    L.push('');\n    L.push('## 6. Current scenario snapshot');\n    L.push('- Global model: `' + cfg.modelName + '` · clustering: `' + (cfg.clustering ? 'on, ' + cfg.numClusters + ' clusters' : 'off') + '` · auto-balance: `' + cfg.autoBalance + '`' + (cfg.manualEnabled ? ' · manual split @ ' + cfg.manualSplit : '') + ' · maxMessageMb: `' + this.maxMb() + '`');\n    L.push('- Aggregate throughput: **' + this.f1(agg) + ' fps**');\n    L.push('');\n    L.push('### Stages & devices');\n    (st.stages || []).forEach(s => {\n      L.push('- **' + s.name + '** (' + s.kind + ')');\n      L.push('  | Device | GFLOPS | MB/s | Lat ms | Cluster |');\n      L.push('  |---|---|---|---|---|');\n      s.devices.forEach(d => L.push('  | ' + d.name + ' | ' + d.gflops + ' | ' + d.bw + ' | ' + d.lat + ' | ' + d.cluster + ' |'));\n    });\n    L.push('');\n    L.push('### Clusters (computed)');\n    L.push('| Cluster | Queue | Edge | Cloud | Cut | Msg | e2e ms | fps |');\n    L.push('|---|---|---|---|---|---|---|---|');\n    clusters.forEach((cl, i) => { const m = metrics[i];\n      L.push('| ' + cl.id + ' | `' + cl.queue + '` | ' + (cl.edges.map(d => d.name).join(', ') || '—') + ' | ' + (cl.clouds.map(d => d.name).join(', ') || '—') + ' | ' + (m
